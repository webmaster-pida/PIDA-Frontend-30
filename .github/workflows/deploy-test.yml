name: Deploy Frontend to Test

on:
  push:
    branches:
      - develop

# 👇 VARIABLES GLOBALES: Se escriben una vez, aplican para ambos portales
env:
  VITE_API_CHAT: "https://api-test.pida-ai.com"
  VITE_FIREBASE_API_KEY: "AIzaSyBaBTRUyPJv1H3L_WkLDUh4m3AJZsR64Ng"
  VITE_FIREBASE_AUTH_DOMAIN: "pida-ai-test.firebaseapp.com"
  VITE_FIREBASE_PROJECT_ID: "pida-ai-test"
  VITE_FIREBASE_STORAGE_BUCKET: "pida-ai-test.firebasestorage.app"
  VITE_FIREBASE_MESSAGING_SENDER_ID: "736009271165"
  VITE_FIREBASE_APP_ID: "1:736009271165:web:a25424ba7924c3b1adbe14"
  VITE_FIREBASE_MEASUREMENT_ID: ""

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # CONSTRUCCIÓN APP PRINCIPAL
      - name: Instalar dependencias (Principal)
        working-directory: ./portal-principal
        run: npm install

      - name: Construir proyecto (Principal)
        working-directory: ./portal-principal
        run: npm run build 
        # (Ya no necesita el bloque env aquí, lo lee de arriba)

      # CONSTRUCCIÓN APP ADMIN
      - name: Instalar dependencias (Admin)
        working-directory: ./portal-admin
        run: npm install

      - name: Construir proyecto (Admin)
        working-directory: ./portal-admin
        run: npm run build
        # (Ya no necesita el bloque env aquí, lo lee de arriba)

      # DESPLIEGUE SEGURO (WIF)
      - name: Autenticación Segura en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/736009271165/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'sa-github-deployer@pida-ai-test.iam.gserviceaccount.com'

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Desplegar ambos sitios en Firebase Hosting
        run: firebase deploy --only hosting --project pida-ai-test --non-interactive --debug